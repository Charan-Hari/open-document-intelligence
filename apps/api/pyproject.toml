[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-document-intelligence-api"
version = "0.1.0"
description = "Local-first document intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pypdf>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]
ml = [
  "sentence-transformers>=3.0,<4.0",
]
ocr = [
  "pytesseract>=0.3.10,<1.0",
  "Pillow>=10.0,<13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_document_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
